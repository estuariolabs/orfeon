[workspace]
resolver = "2"
members = ["crates/orfeon-core", "crates/orfeon-cli", "crates/orfeon-plugin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Motor de voz por modelado físico (MIT, Jameson Hodge). Fijado a un commit.
chimera = { git = "https://github.com/jamesondh/chimera-vocal-synth", rev = "edd2676" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
