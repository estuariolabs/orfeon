[package]
name = "orfeon-app"
description = "Orfeón independiente: toca el coro en tiempo real con un teclado MIDI o con comandos"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "orfeon-vivo"
path = "src/main.rs"

[dependencies]
orfeon-core = { path = "../orfeon-core" }
# salida de audio (WASAPI / CoreAudio / ALSA) y entrada MIDI
cpal = "0.15"
midir = "0.10"
